<title>Dispensa</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one 560px column, phone first. Hero (date, headline, use-soon pills, sync status), servings switch,
   Tonight card, two recipe groups, kitchen list, message history. Message composer pinned to the bottom. */
:root {
  --bg: #eef3ea;
  --card: #ffffff;
  --raised: #f4f7f1;
  --fg: #1c2a20;
  --muted: #5b6e5f;
  --line: #e6ece2;
  --border: #d6e0d0;
  --link: #1c2a20;
  --send: #234d32;
  --me: #234d32;
  --btn-bg: #234d32;
  --btn-fg: #ffffff;
  --red: #a83a1e;
  --orange: #94560a;
  --red-dot: #d9573a;
  --orange-dot: #e0a030;
  --green-dot: #3f8f4f;
  --track: #e1e9dc;
  --seg-on: #ffffff;
  --glass: rgba(238, 243, 234, 0.94);
  --seg-active: #234d32;
  --seg-active-fg: #ffffff;
  --hero-bg: #234d32;
  --hero-fg: #f2f6ee;
  --hero-muted: #b9cdb9;
  --hero-btn: #d4ecc4;
  --shadow: 0 10px 24px rgba(35, 77, 50, 0.22);
  --shadow-sm: 0 2px 6px rgba(35, 77, 50, 0.08);
  --f: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1611; --card: #18221b; --raised: #1f2b22; --fg: #e9f0e6; --muted: #9fb2a2; --line: #26332a; --border: #2f3e33;
  --link: #e9f0e6; --send: #3f8f4f; --me: #2c5a3a; --btn-bg: #8fcf9f; --btn-fg: #0f1611;
  --red: #ff9a80; --orange: #f0b860; --track: #26332a; --seg-on: #2f3e33; --glass: rgba(15, 22, 17, 0.92);
  --seg-active: #8fcf9f; --seg-active-fg: #0f1611; --hero-bg: #1f4a30; --hero-fg: #eef5ea; --hero-muted: #a9c4ab; --hero-btn: #8fcf9f;
  --shadow: 0 10px 24px rgba(0, 0, 0, 0.5); --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1611; --card: #18221b; --raised: #1f2b22; --fg: #e9f0e6; --muted: #9fb2a2; --line: #26332a; --border: #2f3e33;
  --link: #e9f0e6; --send: #3f8f4f; --me: #2c5a3a; --btn-bg: #8fcf9f; --btn-fg: #0f1611;
  --red: #ff9a80; --orange: #f0b860; --track: #26332a; --seg-on: #2f3e33; --glass: rgba(15, 22, 17, 0.92);
  --seg-active: #8fcf9f; --seg-active-fg: #0f1611; --hero-bg: #1f4a30; --hero-fg: #eef5ea; --hero-muted: #a9c4ab; --hero-btn: #8fcf9f;
  --shadow: 0 10px 24px rgba(0, 0, 0, 0.5); --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.4); color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 17px; line-height: 1.4; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent }
button { font: inherit; color: inherit }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
svg { display: block; flex: none }

.wrap { max-width: 560px; margin: 0 auto; padding-inline: 20px; padding-block: 12px calc(150px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 36px }

/* Hero */
.topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px }
.date { font-size: 13px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--muted) }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--card); color: var(--link); display: grid; place-items: center; cursor: pointer }
.icon-btn:disabled { color: var(--muted); cursor: default }
.icon-btn.spinning svg { animation: rot 1.1s linear infinite }
h1 { margin: 6px 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.022em; line-height: 1.08; text-wrap: balance }
.lede { margin: 10px 0 0; font-size: 17px; color: var(--muted) }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px }
.pills:empty { display: none }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 15px; padding: 7px 12px; border-radius: 999px; background: var(--card) }
.pill .pd { color: var(--muted) }
.dot { width: 8px; height: 8px; border-radius: 4px; flex: none }
.status { margin-top: 18px; display: flex; flex-direction: column; gap: 8px }
.status-text { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums }
.bar { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden }
.bar > div { height: 100%; width: 0; background: var(--send); border-radius: 2px; transition: width .9s linear }

/* Servings */
.serv { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-top: -12px }
.serv-label { font-size: 17px; font-weight: 600 }
.seg { display: flex; background: var(--track); border-radius: 10px; padding: 2px; flex: 0 1 216px }
.seg button { flex: 1; font-size: 15px; font-weight: 600; min-height: 36px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-variant-numeric: tabular-nums }
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 1px 3px rgba(0,0,0,.14) }
.seg button:disabled { cursor: default }

/* Sections */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px }
.sec-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.012em }
.sec-head span { font-size: 15px; color: var(--muted) }
.dim { transition: opacity .25s }
.wrap.busy .dim { opacity: .38; pointer-events: none }
.group { background: var(--card); border-radius: 16px; padding: 0 16px }
.group > * + * { border-top: 1px solid var(--line) }
.empty { color: var(--muted); font-size: 15px; padding: 16px 0 }

/* Tonight */
.hero-card { background: var(--card); border-radius: 22px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 20px }
.hc-title { font-size: 26px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.15; text-wrap: balance }
.meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--muted); margin-top: 8px }
.meta span { display: inline-flex; align-items: center; gap: 5px }
.why { margin: 0; font-size: 16px; color: var(--muted); line-height: 1.45 }
.blk { display: flex; flex-direction: column; gap: 8px }
.label { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
.ings { list-style: none; margin: 0; padding: 0 14px; background: var(--raised); border-radius: 12px }
.ings li { display: flex; gap: 14px; padding: 10px 0; font-size: 16px; line-height: 1.35 }
.ings li + li { border-top: 1px solid var(--line) }
.iq { flex: none; width: 64px; color: var(--muted); font-variant-numeric: tabular-nums }
.ings li.noq .iq { display: none }
.iname { flex: 1; min-width: 0 }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px }
.steps li { display: flex; gap: 12px; font-size: 16px; line-height: 1.45 }
.num { flex: none; width: 24px; height: 24px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 13px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; font-variant-numeric: tabular-nums }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px }
.btn-primary { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--btn-fg); background: var(--btn-bg); border: 2px solid var(--btn-bg); border-radius: 22px; padding: 9px 18px; min-height: 44px; cursor: pointer }
.btn-primary.armed { background: transparent; color: var(--fg); border-color: var(--fg) }
.btn-primary:disabled { opacity: .5; cursor: default }
.btn-text { font-size: 16px; color: var(--link); background: none; border: 0; padding: 0; min-height: 44px; cursor: pointer }

/* Recipe rows */
.rrow summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 13px 0; min-height: 60px }
.rrow summary::-webkit-details-marker { display: none }
.rmain { flex: 1; min-width: 0 }
.rt { font-size: 17px }
.rrow[open] .rt { font-weight: 600 }
.rs { font-size: 15px; color: var(--muted); margin-top: 2px }
.chev { color: var(--muted); transition: transform .2s ease }
.rrow[open] .chev { transform: rotate(90deg) }
.rbody { padding: 2px 0 18px; display: flex; flex-direction: column; gap: 18px }

/* Kitchen */
.irow { display: flex; align-items: center; gap: 12px; padding: 10px 0; min-height: 60px }
.imain { flex: 1; min-width: 0 }
.it { font-size: 17px }
.isub { font-size: 14px; color: var(--muted); margin-top: 2px }
.due { font-weight: 600; color: var(--muted) }
.due.red { color: var(--red) }
.due.orange { color: var(--orange) }
.irow.gone .it { color: var(--muted); text-decoration: line-through }
.pick { position: relative; flex: none }
.iqty { margin-left: 8px; font-size: 15px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums }
.pick select { font: inherit; font-size: 14px; font-weight: 500; color: var(--fg); background: var(--raised); border: 1px solid var(--line); border-radius: 17px; padding: 6px 25px 6px 11px; min-height: 34px; -webkit-appearance: none; appearance: none; cursor: pointer }
.pick svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none }
.more { margin-top: 6px }
.more summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; color: var(--link); min-height: 44px }
.more summary::-webkit-details-marker { display: none }
.more[open] summary .chev { transform: rotate(90deg) }
.more .chev { color: var(--link) }
.foot { margin: -12px 0 0; font-size: 13px; color: var(--muted); text-align: center }

/* Message history */
.msgs { display: flex; flex-direction: column; gap: 6px; padding-top: 6px }
.msg-me, .msg-cl { max-width: 85%; padding: 9px 14px; border-radius: 18px; font-size: 15px; line-height: 1.35 }
.msg-me { align-self: flex-end; background: var(--me); color: #ffffff; margin-top: 8px }
.msg-cl { align-self: flex-start; background: var(--card) }

/* Composer */
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 1px solid var(--line) }
.composer-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px }
.bubble { display: flex; align-items: flex-start; gap: 10px; background: var(--card); border-radius: 16px; padding: 10px 6px 10px 14px; font-size: 15px; line-height: 1.35 }
.bubble .btext { flex: 1; min-width: 0; padding-top: 3px; padding-bottom: 3px }
.bubble.error .btext { color: var(--red) }
.bubble .spin { margin-top: 5px }
.bx { flex: none; width: 30px; height: 30px; border: 0; border-radius: 15px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer }
.crow { display: flex; gap: 8px; align-items: flex-end }
textarea { flex: 1; min-width: 0; font: inherit; font-size: 17px; line-height: 1.3; padding: 9px 15px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); color: var(--fg); resize: none; min-height: 40px; max-height: 140px; display: block }
textarea::placeholder { color: var(--muted) }
.send { flex: none; width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--send); color: #ffffff; display: grid; place-items: center; cursor: pointer }
.send:disabled { opacity: .35; cursor: default }

.model-tag { display: block; margin-top: 4px; font-size: 12px; color: var(--muted) }
.head-r { display: flex; align-items: center; gap: 10px }
.sec-head { align-items: center }
.icon-btn.sm { width: 36px; height: 36px; border-radius: 18px }
.icon-btn.sm.spinning svg { animation: rot 1.1s linear infinite }
.car { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; align-items: flex-start; -webkit-overflow-scrolling: touch }
.car::-webkit-scrollbar { display: none }
.page { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always }
.pager { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px }
.pager button { width: 36px; height: 36px; border-radius: 18px; border: 0; background: var(--card); color: var(--fg); display: grid; place-items: center; cursor: pointer }
.pager button:disabled { opacity: .3; cursor: default }
.pg-txt { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 120px; text-align: center }
.topnav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; margin: -12px -20px -18px; padding: 8px 12px 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--line) }
.topnav button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding: 4px 0; border: 0; border-radius: 10px; background: none; color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer; min-width: 0 }
.topnav button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100% }
.topnav button { transition: background .2s, color .2s }
.topnav button.on { background: var(--seg-active); color: var(--link); font-weight: 700 }
.topnav button.on svg { stroke-width: 2.4 }
.topnav .aa { font-size: 19px; font-weight: 600; line-height: 22px; height: 22px }
.textpanel { display: flex; flex-wrap: wrap; margin-top: -12px !important; justify-content: space-between; align-items: center; gap: 12px; background: var(--card); border-radius: 14px; padding: 10px 12px 10px 16px; margin-top: -8px }
.tp-label { font-size: 15px; font-weight: 600 }
.tp-ctl { display: flex; align-items: center; gap: 10px }
.tp-ctl button { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--fg); font-weight: 600; display: grid; place-items: center; cursor: pointer }
.tp-ctl button:disabled { opacity: .35; cursor: default }
#langpanel { margin-top: -24px !important }
#tval { min-width: 48px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums }
main section, main header { scroll-margin-top: 84px }
/* Foto + voti */
.photo-card { background: var(--card); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px }
.photo-card .seg { flex: 1 1 auto }
.hint { margin: 0; font-size: 15px; color: var(--muted); line-height: 1.4 }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px }
.thumbs:empty { display: none }
.thumb { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--track) }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block }
.thumb button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 13px; border: 0; background: rgba(0,0,0,.6); color: #ffffff; display: grid; place-items: center; cursor: pointer }
.photo-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn-secondary { display: inline-flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; color: var(--link); background: var(--raised); border: 1px solid var(--line); border-radius: 22px; padding: 9px 16px; min-height: 44px; cursor: pointer }
.preview { display: flex; flex-direction: column; gap: 12px }
.preview .group { background: var(--raised) }
.prow { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 16px }
.prow span:last-child { color: var(--muted); white-space: nowrap; font-size: 14px }
.warn { margin: 0; font-size: 15px; color: var(--orange) }
.rate { display: inline-flex; gap: 8px; margin-left: auto }
.rate button { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: var(--raised); color: var(--muted); display: grid; place-items: center; cursor: pointer }
.rate button[aria-pressed="true"] { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg) }
.liked { display: inline-flex; align-items: center; gap: 4px }

.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--muted); animation: rot .8s linear infinite; flex: none }
@keyframes rot { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin, .icon-btn.spinning svg { animation-duration: 2.4s } .chev, .bar > div, .dim { transition: none } }
button:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 10px }

/* Pelle in stile Airbnb: stesse forme, colori e dettagli diversi */
h1, .sec-head h2, .hc-title { font-weight: 800 }
.rt, .it { font-weight: 600 }
.rrow[open] .rt { font-weight: 800 }
.date, .label, .serv-label { font-weight: 800 }
.group, .photo-card, .textpanel { border: 1px solid var(--border) }
.hero-card { border: 1px solid var(--border); box-shadow: var(--shadow) }
.pill { background: var(--bg); border: 1px solid var(--border); font-weight: 600 }
.icon-btn, .pager button { background: var(--bg); border: 1px solid var(--border); color: var(--fg) }
.icon-btn:hover, .pager button:hover { box-shadow: var(--shadow-sm) }
.ings { background: var(--raised) }
.btn-primary { font-weight: 800; border-radius: 10px }
.btn-primary.armed { border-radius: 10px }
.btn-secondary { color: var(--fg); background: var(--bg); border-color: var(--fg); border-radius: 10px; font-weight: 800 }
.btn-text, .more summary { color: var(--fg); text-decoration: underline; text-underline-offset: 3px; font-weight: 600 }
.more .chev { color: var(--fg) }
.seg { background: var(--raised); border: 1px solid var(--border) }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); box-shadow: none }
.rate button { background: var(--bg); border-color: var(--border); color: var(--fg) }
.rate button[aria-pressed="true"] { background: var(--send); border-color: var(--send); color: #ffffff }
.pick select { background: var(--bg); border-color: var(--border); font-weight: 600 }
.topnav { border-bottom: 1px solid var(--line) }
.topnav button { color: var(--muted); font-weight: 600 }
.topnav button.on { background: var(--seg-active); color: var(--seg-active-fg); font-weight: 800 }
.composer { border-top: 1px solid var(--line); box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.06) }
textarea { border: 1px solid var(--border); border-radius: 32px; box-shadow: var(--shadow-sm); padding-left: 18px }
.bubble { background: var(--raised) }
.msg-cl { background: var(--raised) }
.bar > div { background: var(--send) }
.due.red { color: var(--red) }
.num { background: var(--fg); color: var(--bg) }
.car { padding: 2px 6px 20px; margin: -2px -6px -20px; scroll-padding-inline: 6px }
.foot { color: var(--muted) }

/* Orto: card Stasera piena verde, miniature colorate */
.hero-card { background: var(--hero-bg); color: var(--hero-fg); border-color: transparent }
.hero-card .meta, .hero-card .why, .hero-card .label, .hero-card .iq { color: var(--hero-muted) }
.hero-card .ings { background: rgba(255, 255, 255, 0.1) }
.hero-card .ings li + li { border-top-color: rgba(255, 255, 255, 0.14) }
.hero-card .num { background: var(--hero-fg); color: var(--hero-bg) }
.hero-card .btn-primary { background: var(--hero-btn); border-color: var(--hero-btn); color: #1c2a20 }
.hero-card .btn-primary.armed { background: transparent; color: var(--hero-fg); border-color: var(--hero-fg) }
.hero-card .btn-text { color: var(--hero-fg) }
.hero-card .rate button { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.25); color: var(--hero-fg) }
.hero-card .rate button[aria-pressed="true"] { background: var(--hero-fg); color: var(--hero-bg); border-color: var(--hero-fg) }
.thumb-sq { width: 40px; height: 40px; border-radius: 12px; flex: none }
.pill { border-color: #f0c9bd; color: var(--red) }
.pill .pd { color: var(--red); opacity: .75 }
.pick select { background: var(--raised); border-color: transparent }
.rate button[aria-pressed="true"] { background: var(--btn-bg); border-color: var(--btn-bg); color: var(--btn-fg) }
.seg button[aria-pressed="true"] { background: var(--seg-active); color: var(--seg-active-fg) }
.ctrls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; flex: none; max-width: 190px }
.datepick { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--fg); background: var(--raised); border-radius: 17px; padding: 6px 11px; min-height: 34px; cursor: pointer; white-space: nowrap }
.datepick svg { color: var(--muted) }
.datepick input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: 0; padding: 0; margin: 0; font-size: 16px }
.datepick:focus-within { outline: 2px solid var(--link); outline-offset: 2px }
</style>

<main class="wrap" id="wrap">

const LOCALES = { it: "it-IT", en: "en-US", fr: "fr-FR", es: "es-ES" };

const pad = n => String(n).padStart(2, "0");
const isoOf = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
function todayISO() { return isoOf(new Date()); }
function daysLeft(iso) { if (!iso) return null; return Math.round((new Date(iso + "T00:00:00") - new Date(todayISO() + "T00:00:00")) / 86400000); }
function fmtDate(iso) { return iso ? new Date(iso + "T00:00:00").toLocaleDateString(loc(), { day: "numeric", month: "short" }) : ""; }
function weekday(iso) { return new Date(iso + "T00:00:00").toLocaleDateString(loc(), { weekday: "long" }); }
function cap(s) { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); }
function listNames(a) { a = a.map(x => String(x).toLowerCase()); return a.length <= 1 ? a.join("") : a.slice(0, -1).join(", ") + " " + t("and") + " " + a[a.length - 1]; }
function people(n) { n = Number(n); return n >= 4 ? t("people4") : t("people", { n }); }
function peopleEn(n) { n = Number(n); return n >= 4 ? "4+ people" : n === 1 ? "1 person" : n + " people"; } /* per i prompt, sempre in inglese */
const byUse = (a, b) => String(a.useBy || "9999").localeCompare(String(b.useBy || "9999"));

function splitIng(s) {
  const m = String(s).match(/^((?:\d+(?:[.,]\d+)?|\d+\/\d+|[½¼¾])(?:\s*(?:-|–|o|or|ou)\s*\d+(?:[.,]\d+)?)?\s*(?:kg|g|ml|cl|l|tbsp|tsp|lb|oz)?\.?)\s+(.+)$/i);

}

  const valid = new Set(state.inventory.map(i => i.id));
  for (const u of (out.inventory_updates || [])) {
    if (!u || !valid.has(u.id)) continue;
    const patch = {};
    if (["full", "half", "low", "gone"].includes(u.status)) patch.status = u.status;
    if (isDate(u.useBy)) patch.useBy = u.useBy;
    for (const k of ["qty", "storage", "name"]) if (typeof u[k] === "string" && u[k].trim()) patch[k] = u[k].trim();
    if (Object.keys(patch).length) await db.collection("inventory").doc(u.id).update(patch);
  }
  const idMap = {};
  for (const n of (out.new_items || [])) {
    if (!n || !n.name || !isDate(n.useBy)) continue;
    let id = slugify(n.name);
    while (valid.has(id)) id += "-2";
    valid.add(id); idMap["new:" + n.name] = id;
    await db.collection("inventory").doc(id).set({ name: n.name, qty: n.qty || "", storage: n.storage || "Fridge", bought: isDate(n.bought) ? n.bought : todayISO(), useBy: n.useBy, status: "full", source });
  }
  await writeRecipes(out.recipes, at, source, idMap);
}

async function send(override, opts = {}) {
  const typed = typeof override !== "string";
  const text = typed ? $("fb").value.trim() : override;
  if (!text || busy || !db) return false;
  setBusy(true, opts.label);
  const at = new Date().toISOString();
  let fbRef = null;
  try {
    if (!opts.silentLog) fbRef = await db.collection("feedback").add({ text: opts.cooked ? t("cookedLog", { title: opts.cooked }) : text, prompt: text, at, status: "open" });
    if (typed) { $("fb").value = ""; grow(); }
    if (!sample) { showBubble(t("savedLater"), "reply"); return true; }
    const out = await askJSON(buildPrompt(text), { modelTier: "default" });
    await applyOut(out, at, "message");
    if (fbRef) await fbRef.update({ status: "applied", reply: out.reply || "", model: out.__model });
    showBubble(out.reply || t("done"), "reply", out.__model);
    return true;
  } catch (e) {
    const code = (e && (e.code || e.message)) || t("error");
    showBubble(e && e.code === "not_granted" ? t("liveOff") + (fbRef ? t("noteSaved") : "")
      : t("failed", { code }) + (fbRef ? t("noteSaved") : t("retry")), "error");
    return false;
  } finally { setBusy(false); }
}

/* ---------- nuove ricette ---------- */
const SLOTS = { tonight: { tier: "simple", ranks: [1] }, quick: { tier: "simple", ranks: [2, 3] }, slow: { tier: "complex", ranks: [1, 2, 3] } };
function refreshPrompt(tier, n, avoid) {
  return baseContext() + `
${owner()} wants ${n} NEW "${tier}" recipe(s) (${tier === "simple" ? "25 min or less, few steps" : "medium to high complexity"}).
Do not repeat or closely vary any of these dishes already proposed: ${JSON.stringify(avoid)}.
Use only in-stock items plus the staples, prioritize items with the fewest days left, follow the ratings.
Be honest: if this inventory allows fewer than ${n} genuinely sensible new dishes (not forced, odd or repetitive combinations), return only the sensible ones, even zero, set "exhausted": true and write a one-sentence ${t("p_lang")} "reason" that says what to buy to unlock new ideas. Otherwise set "exhausted": false and "reason": "".

Return ONLY JSON in this shape:
{"exhausted": boolean, "reason": string, ${RECIPE_SHAPE()}}`;
}
async function refreshSlot(key) {
  if (busy || !sample || !db) return;
  const { tier, ranks } = SLOTS[key];
  const avoid = [...new Set([...state.recipes.map(r => r.title), ...(state.shown || [])])];
  const btn = document.querySelector(`[data-refresh="${key}"]`);
  btn.classList.add("spinning");
  setBusy(true, ranks.length === 1 ? t("findingOne") : t("findingMany"));
  try {
    const out = await askJSON(refreshPrompt(tier, ranks.length, avoid), { modelTier: "default" });
    const recs = (out.recipes || []).filter(r => r && r.id && r.title).slice(0, ranks.length);
    if (!recs.length) { showBubble(out.reason || t("noMoreRecipes"), "reply", out.__model); return; }
    const at = new Date().toISOString();
    const taken = new Set(state.recipes.map(r => r.id));
    for (let i = 0; i < recs.length; i++) {
      const { id: rawId, ...body } = recs[i]; let id = slugify(rawId);
      while (taken.has(id)) id += "-2";
      taken.add(id);
      await db.collection("recipes").doc(id).set({ ...body, tier, rank: ranks[i], slot: key, batch: at, generated: at, source: "refresh" });
    }
    const pages = pagesFor(key);
    for (const old of pages.slice(0, Math.max(0, pages.length - 5))) for (const r of old.list) await db.collection("recipes").doc(r.id).delete();
    const shown = [...(state.shown || []), ...recs.map(r => r.title)].slice(-40);
    await db.doc("meta/shown").set({ titles: shown });
    view[key] = null;
    showBubble(out.exhausted ? (recs.length < ranks.length ? t("onlyFound", { n: recs.length }) : "") + (out.reason || t("almostOut"))
      : (recs.length === 1 ? t("newDish") : t("newRecipes")), "reply", out.__model);
  } catch (e) {
    showBubble(t("errRecipes", { code: (e && (e.code || e.message)) || t("error") }), "error");
  } finally { btn.classList.remove("spinning"); setBusy(false); }
}
for (const b of document.querySelectorAll("[data-refresh]")) b.addEventListener("click", () => refreshSlot(b.dataset.refresh));
function updateRefreshBtns() { for (const b of document.querySelectorAll("[data-refresh]")) b.disabled = busy || !sample || !db; }

/* ---------- foto ---------- */
let pmode = "receipt", photos = [], imgLimits = null, fridgePlan = null;
const PHINT = { receipt: "hintReceipt", fridge: "hintFridge" };
function renderPhotos() {
  for (const b of $("pmode").querySelectorAll("button")) b.setAttribute("aria-pressed", String(b.dataset.m === pmode));
  $("phint").textContent = !sample ? t("signInPhotos") : !imgLimits ? t("photosNoView") : t(PHINT[pmode]);
  const th = $("thumbs"); th.textContent = "";
  photos.forEach((p, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    d.innerHTML = `<img alt="${esc(t("photoAlt", { n: i + 1 }))}" src="${p.url}"><button type="button" aria-label="${esc(t("removePhoto", { n: i + 1 }))}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>`;
    d.querySelector("button").addEventListener("click", () => { URL.revokeObjectURL(p.url); photos.splice(i, 1); renderPhotos(); });
    th.appendChild(d);
  });
  const a = $("analyze");
  a.disabled = busy || !photos.length || !imgLimits || !db;
  a.textContent = photos.length ? t("analyzeN", { n: photos.length }) : t("analyze");
  $("pick").hidden = !imgLimits;
}
for (const b of $("pmode").querySelectorAll("button")) b.addEventListener("click", () => { pmode = b.dataset.m; fridgePlan = null; $("preview").hidden = true; renderPhotos(); });
$("files").addEventListener("change", e => {
  const max = imgLimits ? imgLimits.maxCount : 10;
  let skipped = 0;
  for (const f of e.target.files) {
    if (photos.length >= max) { skipped++; continue; }
    if (imgLimits && imgLimits.maxInputBytes && f.size > imgLimits.maxInputBytes) { skipped++; continue; }
    photos.push({ file: f, url: URL.createObjectURL(f) });
  }
  e.target.value = "";
  if (skipped) showBubble(t("skipped", { n: skipped, max }), "error");
  renderPhotos();
});
function clearPhotos() { photos.forEach(p => URL.revokeObjectURL(p.url)); photos = []; renderPhotos(); }
$("analyze").addEventListener("click", async () => {
  if (!photos.length || busy || !sample) return;
  const files = photos.map(p => p.file), n = files.length, at = new Date().toISOString();
  setBusy(true, pmode === "receipt" ? t("readingReceipts", { n }) : t("lookingFridge"));
  try {
    if (pmode === "receipt") {
      const out = await askJSON(receiptPrompt(n), { images: files, modelTier: "default" });
      await applyOut(out, at, "photo receipt");
      await db.collection("feedback").add({ text: t("receiptLog", { n }), at, status: "applied", reply: out.reply || "", model: out.__model });
      clearPhotos();
      showBubble(out.reply || t("done"), "reply", out.__model);
    } else {
      const out = await askJSON(fridgePrompt(n), { images: files, modelTier: "default" });
      const items = (out.items || []).filter(i => i && i.id && i.name);
      if (!items.length) { showBubble(out.reply || t("noFood"), "error"); return; }
      fridgePlan = { out, items, at };
      renderPlan();
    }
  } catch (e) {
    showBubble(e && e.code === "images_unavailable" ? t("photosNoHere")
      : e && e.code === "image_rejected" ? t("photoRejected")
      : t("failed", { code: (e && (e.code || e.message)) || t("error") }) + t("retry"), "error");
  } finally { setBusy(false); renderPhotos(); }
});
function renderPlan() {
  const box = $("preview");
  if (!fridgePlan) { box.hidden = true; box.textContent = ""; return; }
  const { items } = fridgePlan;
  const newIds = new Set(items.map(i => i.id));
  const removed = active().filter(i => !newIds.has(i.id)).map(i => i.name);
  box.hidden = false;
  box.innerHTML = `<p class="hint">${esc(fridgePlan.out.reply || "")}</p>` +
    `<div class="label">${esc(t("newPantry", { n: items.length }))}</div>` +
    `<div class="group">${items.map(i => `<div class="prow"><span>${esc(i.name)}${i.qty ? " · " + esc(i.qty) : ""}</span><span>${esc(t("untilLower", { date: fmtDate(i.useBy) }))}</span></div>`).join("")}</div>` +
    (removed.length ? `<p class="warn">${esc(t("willRemove", { list: listNames(removed) }))}</p>` : "") +
    `<div class="photo-actions"><button type="button" class="btn-primary" id="plan-ok">${esc(t("replacePantry"))}</button><button type="button" class="btn-text" id="plan-no">${esc(t("cancel"))}</button></div>`;
  $("plan-no").addEventListener("click", () => { fridgePlan = null; renderPlan(); });
  $("plan-ok").addEventListener("click", applyPlan);
}
async function applyPlan() {
  if (!fridgePlan || busy) return;
  const { out, items, at } = fridgePlan;
  setBusy(true, t("replacing"));
  try {
    const byId = Object.fromEntries(state.inventory.map(i => [i.id, i]));
    const newIds = new Set(items.map(i => i.id));
    for (const old of state.inventory) if (!newIds.has(old.id)) await db.collection("inventory").doc(old.id).delete();
    for (const i of items) {
      const prev = byId[i.id] || {};
      await db.collection("inventory").doc(i.id).set({
        name: i.name, qty: i.qty || prev.qty || "", storage: i.storage || prev.storage || "Fridge",
        bought: isDate(i.bought) ? i.bought : (prev.bought || todayISO()), useBy: isDate(i.useBy) ? i.useBy : (prev.useBy || todayISO()),
        status: prev.status && prev.status !== "gone" ? prev.status : "full", source: "photo fridge"
      });
    }
    await writeRecipes(out.recipes, at, "photo fridge");
    await db.collection("feedback").add({ text: t("fridgeLog"), at, status: "applied", reply: out.reply || "", model: out.__model });
    fridgePlan = null; renderPlan(); clearPhotos();
    showBubble(t("replaced", { n: items.length }), "reply", out.__model);
  } catch (e) {
    showBubble(t("errReplace", { code: (e && (e.code || e.message)) || t("error") }), "error");
  } finally { setBusy(false); renderPhotos(); }
}
renderPhotos();

/* ---------- persone ---------- */
function renderServings() {
  const n = Math.min(servings(), 4);
  for (const b of $("seg").querySelectorAll("button")) b.setAttribute("aria-pressed", String(Number(b.dataset.n) === n));
}
for (const b of $("seg").querySelectorAll("button")) b.addEventListener("click", async () => {
  const n = Number(b.dataset.n);
  if (!db || busy || n === Math.min(servings(), 4)) return;
  const prev = state.meta.servings;
  state.meta.servings = n; renderServings();
  try { await db.doc("meta/state").update({ servings: n }); }
  catch (e) { state.meta.servings = prev; renderServings(); showBubble(t("errSave", { code: e.code || e.message }), "error"); return; }
  await send("I now cook for " + (n >= 4 ? "4 or more people" : peopleEn(n)) + ". Rescale every recipe, do not change anything in the inventory.",
    { silentLog: true, label: t("rescaling", { people: people(n) }) });
});
renderServings();

/* ---------- controllo scontrini + avanzamento ---------- */
const TRIGGER_ID = () => state.meta.manualTriggerId || ""; /* id del controllo manuale, scritto in meta/state dal setup */
const owner = () => state.meta.owner || "the user";
const cuisine = () => state.meta.cuisine || "Italian home cooking";
const EXPECTED_MS = 3 * 60 * 1000;
const STAGES = [[0, "stage0"], [0.12, "stage1"], [0.35, "stage2"], [0.6, "stage3"], [0.78, "stage4"], [0.92, "stage5"]];
let sync = null, tick = null, ownerView = true;
function loadSync() { try { const s = JSON.parse(localStorage.getItem("dispensa-sync") || "null"); if (s && Date.now() - s.start < 15 * 60000) return s; } catch (e) {} return null; }
function saveSync(s) { try { s ? localStorage.setItem("dispensa-sync", JSON.stringify(s)) : localStorage.removeItem("dispensa-sync"); } catch (e) {} }
function lastSyncText() {
  const ls = state.meta.lastSync;
  if (!ls) return t("notChecked");
  const d = new Date(ls);
  if (isNaN(d) || d.getFullYear() < 2020) return t("lastCheck", { v: ls });
  const diff = Math.round((new Date(todayISO() + "T00:00:00") - new Date(isoOf(d) + "T00:00:00")) / 86400000);
  const time = d.toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" });
  return diff === 0 ? t("syncToday", { time }) : diff === 1 ? t("syncYesterday", { time }) : t("syncOn", { date: d.toLocaleDateString(loc(), { day: "numeric", month: "short" }), time });
}
function renderStatusIdle() { if (sync) return; $("stage").textContent = ownerView ? lastSyncText() : lastSyncText() + " · " + t("ownerOnly"); $("eta").textContent = ""; $("bar").hidden = true; }
function drawSync() {
  if (!sync) return;
  const el = Date.now() - sync.start;
  const p = el < EXPECTED_MS ? (el / EXPECTED_MS) * 0.92 : 0.92 + 0.06 * (1 - Math.exp(-(el - EXPECTED_MS) / 120000));
  $("barfill").style.width = (p * 100).toFixed(1) + "%";
  $("bar").setAttribute("aria-valuenow", String(Math.round(p * 100)));
  $("stage").textContent = t(STAGES.filter(s => p >= s[0]).pop()[1]);
  $("eta").textContent = el < EXPECTED_MS ? t("etaMin", { n: Math.max(1, Math.ceil((EXPECTED_MS - el) / 60000)) }) : t("slowSync");
}
function startTicker() {
  $("bar").hidden = false; const s = $("sync"); s.disabled = true; s.classList.add("spinning");
  drawSync(); clearInterval(tick); tick = setInterval(drawSync, 1000);
}
function stopTicker() { clearInterval(tick); const s = $("sync"); s.classList.remove("spinning"); s.disabled = !mcp || !ownerView; }
function finishSync() {
  stopTicker(); sync = null; saveSync(null);
  $("barfill").style.width = "100%"; $("bar").setAttribute("aria-valuenow", "100");
  $("stage").textContent = t("updatedNow"); $("eta").textContent = "";
  setTimeout(renderStatusIdle, 3000);
}
async function runSync() {
  if (!mcp || sync || !ownerView) return;
  if (!TRIGGER_ID()) { $("stage").textContent = t("noManual"); return; }
  sync = { start: Date.now(), from: state.meta.lastSync || "" }; saveSync(sync); $("barfill").style.width = "0"; startTicker();
  try {
    await mcp.callTool("Claude Code Remote", "fire_trigger",
      { trigger_id: TRIGGER_ID(), text: "Manual check requested from the pantry dashboard. Run all the steps now. Always update meta/state lastSync at the end, even if nothing changed." },
      { cache: false });
  } catch (e) {
    stopTicker(); sync = null; saveSync(null); $("bar").hidden = true; $("eta").textContent = "";
    $("stage").textContent = e && (e.code === "not_granted" || e.code === "denied")
      ? t("allowConnector")
      : e && (e.code === "not_found" || e.code === "forbidden" || e.code === "permission_denied") ? t("ownerOnly")
      : t("cantStart", { code: (e && (e.code || e.message)) || t("error") });
  }
}
$("sync").addEventListener("click", runSync);

/* ---------- navigazione + dimensione testo ---------- */
const ZOOMS = [0.85, 1, 1.15, 1.3, 1.45];
let zi = 0;
try { const z = Number(localStorage.getItem("dispensa-zoom-v2")); if (ZOOMS.includes(z)) zi = ZOOMS.indexOf(z); } catch (e) {}
function applyZoom() {
  document.body.style.zoom = ZOOMS[zi];
  document.querySelector(".topnav").style.zoom = 1 / ZOOMS[zi];
  { const nv = document.querySelector(".topnav"); nv.style.marginLeft = nv.style.marginRight = (-20 * ZOOMS[zi]) + "px"; }
  $("tval").textContent = Math.round(ZOOMS[zi] * 100) + "%";
  $("tminus").disabled = zi === 0; $("tplus").disabled = zi === ZOOMS.length - 1;
  try { localStorage.setItem("dispensa-zoom-v2", String(ZOOMS[zi])); } catch (e) {}
}
$("tminus").addEventListener("click", () => { if (zi > 0) { zi--; applyZoom(); } });
$("tplus").addEventListener("click", () => { if (zi < ZOOMS.length - 1) { zi++; applyZoom(); } });
applyZoom();
const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const NAV_IDS = ["tonight-sec", "sec-quick", "sec-slow", "sec-photo", "sec-kitchen"];
let navLock = null, navLockTimer = null;
function setActive(id) { for (const b of document.querySelectorAll("[data-go]")) { const on = b.dataset.go === id; b.classList.toggle("on", on); if (on) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); } }
function computeActive() {
  if (navLock) return;
  const navH = document.querySelector(".topnav").getBoundingClientRect().bottom;
  let cur = null;
  for (const id of NAV_IDS) { const el = $(id); if (!el || el.hidden) continue; if (el.getBoundingClientRect().top <= navH + 24) cur = id; }
  setActive(cur);
}
let navRaf = 0;
window.addEventListener("scroll", () => { if (!navRaf) navRaf = requestAnimationFrame(() => { navRaf = 0; computeActive(); }); }, { passive: true });
window.addEventListener("resize", computeActive);
for (const b of document.querySelectorAll("[data-go]")) b.addEventListener("click", () => {
  const el = $(b.dataset.go);
  if (!el || el.hidden) { showBubble(b.dataset.go === "tonight-sec" ? t("noTonight") : t("sectionNA"), "reply"); return; }
  navLock = b.dataset.go; setActive(navLock);
  el.scrollIntoView({ behavior: reduce() ? "auto" : "smooth", block: "start" });
  clearTimeout(navLockTimer);
  let last = -1, still = 0;
  const watch = () => { const y = window.scrollY; still = y === last ? still + 1 : 0; last = y; if (still >= 3) { navLock = null; return; } navLockTimer = setTimeout(watch, 80); };
  navLockTimer = setTimeout(watch, 120);
});
computeActive();

/* ---------- lingua ---------- */
function applyLang() {
  applyStatic(); renderDate();
  if (seen.has("inventory")) renderAll();
  else { if (db) $("headline").textContent = t("loading"); if (seen.has("recipes")) renderRecipes(); if (seen.has("feedback")) renderHistory(); }
  renderServings(); renderPhotos(); renderPlan(); renderStatusIdle(); drawSync();
}
$("langsel").addEventListener("change", async () => {
  const next = $("langsel").value;
  if (!db || !I18N[next] || next === lang()) { $("langsel").value = lang(); return; }
  const prev = state.meta.lang;
  state.meta.lang = next; applyLang();
  try { await db.doc("meta/state").update({ lang: next }); }
  catch (e) { state.meta.lang = prev; applyLang(); showBubble(t("errLang", { code: e.code || e.message }), "error"); }
});

/* ---------- avvio ---------- */
(async () => {
  mcp = await window.claude?.use?.("mcp") ?? null;
  const viewer = await window.claude?.use?.("user") ?? null;
  if (viewer) { try { ownerView = await viewer.isOwner(); } catch (e) { ownerView = true; } }
  if (!ownerView) { $("sync").disabled = true; renderStatusIdle(); }
  if (mcp) { const s = loadSync(); if (s) { sync = s; startTicker(); } }
})();
(async () => {
  db = await window.claude?.use?.("db") ?? null;
  sample = await window.claude?.use?.("sample") ?? null;
  if (!db) { $("headline").textContent = t("signIn"); $("stage").textContent = ""; return; }
  updateSend(); $("langsel").disabled = false;
  db.collection("inventory").onSnapshot(s => { state.inventory = s.docs.map(d => ({ id: d.id, ...d.data() })); seen.add("inventory"); renderAll(); });
  db.collection("recipes").onSnapshot(s => { state.recipes = s.docs.map(d => ({ id: d.id, ...d.data() })); seen.add("recipes"); renderRecipes(); });
  db.collection("feedback").onSnapshot(s => { state.feedback = s.docs.map(d => ({ id: d.id, ...d.data() })); seen.add("feedback"); renderHistory(); });
  db.doc("meta/shown").onSnapshot(d => { state.shown = (d.data() || {}).titles || []; });
  db.collection("ratings").onSnapshot(s => {
    state.ratingDocs = {}; state.ratings = {};
    for (const d of s.docs) { const v = d.data(); state.ratingDocs[d.id] = v; state.ratings[d.id] = v.vote; }
    renderRecipes();
  });
  if (sample) { try { imgLimits = (await sample.limits())?.images || null; } catch (e) { imgLimits = null; } if (imgLimits) $("files").accept = imgLimits.mediaTypes.join(","); }
  renderPhotos(); updateRefreshBtns();
  db.doc("meta/state").onSnapshot(d => {
    state.meta = d.data() || {};
    if (lang() !== shownLang) applyLang();
    renderServings();
    if (mcp && !sync && ownerView) $("sync").disabled = false;
    if (sync && state.meta.lastSync && state.meta.lastSync !== sync.from) finishSync(); else renderStatusIdle();
  });
})();
</script>
